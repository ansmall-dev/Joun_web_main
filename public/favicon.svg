<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Joun Visa">
  <!-- V2 여권 배지 마크 — JV/보더/MRZ 라인을 투명하게 뚫어 헤더의 invert 필터에서도 형태 유지 -->
  <defs>
    <mask id="jv-knockout">
      <rect width="120" height="120" fill="#fff"/>
      <rect x="21" y="21" width="78" height="78" rx="8" fill="none" stroke="#000" stroke-width="1.5"/>
      <text x="60" y="76" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="44" fill="#000">JV</text>
      <line x1="30" y1="90" x2="90" y2="90" stroke="#000" stroke-width="2" stroke-dasharray="6 4"/>
    </mask>
  </defs>
  <rect x="14" y="14" width="92" height="92" rx="12" fill="#8b1a1a" mask="url(#jv-knockout)"/>
</svg>
