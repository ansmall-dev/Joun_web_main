<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Justice of the Peace">
  <!-- Justice of the Peace 실(seal) — 배경 투명, 스캘럽 테두리 + 글로시 레드 -->
  <defs>
    <radialGradient id="jp-red" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#c8202c"/>
      <stop offset="60%" stop-color="#a5121d"/>
      <stop offset="100%" stop-color="#7e0c15"/>
    </radialGradient>
    <linearGradient id="jp-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 스캘럽(물결) 테두리: 원 둘레를 따라 도트 범프 -->
  <circle cx="60" cy="60" r="53" fill="none" stroke="url(#jp-red)" stroke-width="9"
          stroke-dasharray="0.1 9.25" stroke-linecap="round"/>
  <circle cx="60" cy="60" r="52" fill="url(#jp-red)"/>
  <circle cx="60" cy="60" r="45" fill="none" stroke="#f2d9d9" stroke-width="1.2" opacity="0.85"/>
  <!-- 글로시 하이라이트 -->
  <ellipse cx="60" cy="38" rx="38" ry="22" fill="url(#jp-gloss)"/>
  <g text-anchor="middle" fill="#fdf6f0" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="60" y="50" font-size="17" font-weight="bold">Justice</text>
    <text x="60" y="66" font-size="11">of the</text>
    <text x="60" y="86" font-size="17" font-weight="bold">Peace</text>
  </g>
</svg>
